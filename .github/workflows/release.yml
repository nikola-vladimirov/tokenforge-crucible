# A push to main whose plugin Version has no release yet publishes release vX.Y.Z with the plugin zip.
# Sites with TokenForge Crucible then see the update in Dashboard > Updates.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check that every PHP file parses on PHP 7.4
        run: |
          docker run --rm --network none -v "$PWD:/app:ro" -w /app php:7.4-cli sh -c 'find . -name "*.php" -not -path "./.git/*" | while IFS= read -r f; do o=$(php -l "$f" 2>&1) || { echo "$o"; exit 1; }; done'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^ \* Version:[[:space:]]*//p' tokenforge-crucible.php | tr -d '\r')
          c=$(sed -n "s/.*TOKENFORGE_CRUCIBLE_VERSION', '\([^']*\)'.*/\1/p" tokenforge-crucible.php)
          s=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '\r')
          if [ -z "$v" ] || [ "$v" != "$c" ] || [ "$v" != "$s" ]; then echo "version mismatch: header $v, constant $c, stable tag $s"; exit 1; fi
          if gh release view "v$v" > /dev/null 2>&1; then echo "v$v is already released"; exit 0; fi
          git archive --format=zip --prefix=tokenforge-crucible/ -o "tokenforge-crucible-$v.zip" HEAD
          awk -v h="## $v" '$0 == h { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release create "v$v" "tokenforge-crucible-$v.zip" --title "TokenForge Crucible $v" --notes-file notes.md --target "$GITHUB_SHA"
